name: Something is broken
description: Wi24rd FTP does something other than it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Leave out passwords, public addresses and the names of your files. Describe them instead.
        A security problem does not belong here: use **Report a vulnerability** under the Security tab.
  - type: input
    id: version
    attributes:
      label: Wi24rd FTP version
      description: Shown in the About dialog.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - FTP
        - SFTP
        - Installing or uninstalling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be seen again?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The lines that matter from the log
      description: The log is in %ProgramData%\Wi24rdFTP\log. Check the lines for addresses, user names and file names before you paste them.
      render: text
