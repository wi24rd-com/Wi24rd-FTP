<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132B52"/>
      <stop offset="1" stop-color="#071226"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD6FF"/>
      <stop offset="1" stop-color="#1E8BFF"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F5FA8"/>
      <stop offset="1" stop-color="#0E2A5C"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#1261D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FE8FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1E8BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#2E6BD6" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Magic glow behind hat tip -->
  <circle cx="150" cy="58" r="40" fill="url(#glow)"/>

  <!-- Wizard hat -->
  <path d="M150 34 C 142 70, 110 110, 70 134 L 186 134 C 180 100, 170 70, 150 34 Z" fill="url(#hat)"/>
  <path d="M150 34 C 146 62, 128 96, 100 124 L 150 124 Z" fill="#3F77C9" opacity="0.35"/>
  <!-- Hat brim -->
  <path d="M52 134 Q 128 118, 204 134 Q 128 152, 52 134 Z" fill="#1D4A99"/>
  <path d="M52 134 Q 128 118, 204 134" fill="none" stroke="#5FD6FF" stroke-width="3" stroke-linecap="round"/>
  <!-- Star on hat -->
  <path d="M150 30 l 4.5 10 l 11 1.2 l -8.2 7.4 l 2.3 10.8 l -9.6 -5.6 l -9.6 5.6 l 2.3 -10.8 l -8.2 -7.4 l 11 -1.2 z" fill="#CFF4FF"/>

  <!-- Folder -->
  <path d="M66 156 h 44 l 12 12 h 68 a 10 10 0 0 1 10 10 v 44 a 10 10 0 0 1 -10 10 h -124 a 10 10 0 0 1 -10 -10 v -56 a 10 10 0 0 1 10 -10 z" fill="url(#folder)"/>
  <path d="M56 180 h 144 v 42 a 10 10 0 0 1 -10 10 h -124 a 10 10 0 0 1 -10 -10 z" fill="#1E8BFF" opacity="0.55"/>

  <!-- Upload arrow -->
  <path d="M128 222 v -34" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M110 204 l 18 -18 l 18 18" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
